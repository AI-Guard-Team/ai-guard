name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- .NET API ----------
  api:
    name: api (.NET build + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aiguard
          POSTGRES_PASSWORD: aiguard_ci
          POSTGRES_DB: aiguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=aiguard_test;Username=aiguard;Password=aiguard_ci
      JWT_SECRET: ci_only_secret_not_for_production_32chars
      VISION_SERVICE_KEY: ci_only
      EVIDENCE_ENCRYPTION_KEY: Y2lfb25seV9rZXlfMzJfYnl0ZXNfX19fX19fX19fX18=
    steps:
      - uses: actions/checkout@v4
      - name: api projesi var mı?
        id: check
        run: |
          if ls api/*.sln api/*.slnx >/dev/null 2>&1 || find api -name '*.csproj' | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "api klasöründe henüz proje yok, atlanıyor."
          fi
      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.exists == 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        if: steps.check.outputs.exists == 'true'
        working-directory: api
        run: dotnet restore
      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: api
        run: dotnet build --no-restore -c Release
      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: api
        run: dotnet test --no-build -c Release --verbosity normal

  # ---------- Python vision ----------
  vision:
    name: vision (lint + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: vision projesi var mı?
        id: check
        run: |
          if [ -f vision/requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "vision/requirements.txt yok, atlanıyor."
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vision/requirements.txt
      - name: Bağımlılıklar
        if: steps.check.outputs.exists == 'true'
        working-directory: vision
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Lint (ruff)
        if: steps.check.outputs.exists == 'true'
        working-directory: vision
        run: ruff check .
      - name: Test (pytest)
        if: steps.check.outputs.exists == 'true'
        working-directory: vision
        run: |
          set +e
          pytest -q
          code=$?
          # 5 = hiç test bulunamadı; iskelet aşamasında hata sayma
          if [ $code -eq 5 ]; then echo "Henüz test yok."; exit 0; fi
          exit $code

  # ---------- React web ----------
  web:
    # Ad değişmemeli: dal kural setinde (main-dev-koruma) zorunlu kontrol bu adla kayıtlı.
    # İş artık lint ve testleri de çalıştırıyor.
    name: web (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: web projesi var mı?
        id: check
        run: |
          if [ -f web/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "web/package.json yok, atlanıyor."
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          # jsdom 31 ve vitest 5 Node 22.22+ / 24+ istiyor; 20'de testler hiç başlamıyor.
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Kurulum
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm ci
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm run lint
      - name: Test (vitest)
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm test
      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm run build

  # ---------- Docker Compose (E1b) ----------
  compose:
    name: compose (docker compose up + health)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # README'deki tek komutla aynı: örnek değerlerle çalıştır.
      COMPOSE: docker compose --env-file .env.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compose kural testleri
        run: |
          pip install pytest
          python -m pytest tests/compose -q
      - name: Servisleri başlat
        # api, migrate tamamlanmadan ve postgres/vision sağlıklı olmadan başlamaz;
        # biri başarısız olursa bu adım hata verir.
        run: $COMPOSE up -d --build
      - name: api sağlık ucu
        run: |
          # API'nin açılması birkaç saniye sürebilir; 60 sn boyunca dene.
          for i in $(seq 1 30); do
            body=$(curl -fsS http://localhost:8080/health || true)
            if [ "$body" = "Healthy" ]; then echo "api /health: $body"; exit 0; fi
            sleep 2
          done
          echo "api /health yanıt vermedi (son yanıt: '$body')"; exit 1
      - name: vision yalnızca iç ağda
        run: |
          # Dışarıdan erişilememeli.
          if curl -fsS --max-time 3 http://localhost:8000/health; then
            echo "HATA: vision bilgisayardan erişilebilir durumda"; exit 1
          fi
          # api ile aynı iç ağdan erişilebilmeli.
          $COMPOSE run --rm --no-deps vision \
            python -c "import urllib.request; print(urllib.request.urlopen('http://vision:8000/health', timeout=3).read().decode())"
      - name: web ayakta ve /api'yi iletiyor
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:5173/; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:5173/ || { echo "web yanıt vermedi"; exit 1; }
          # /api isteği nginx'ten api'ye gitmeli. Giriş isteyen bir uca girişsiz istek atılıyor: api'den
          # 401 gelirse iletim çalışıyor demek (api'ye ulaşılamazsa nginx 502 döner). E2'den beri her uç
          # varsayılan olarak giriş istediği için yanıt 405 değil 401 (K-20).
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/api/users)
          echo "web -> api: $code"
          [ "$code" = "401" ] || { echo "HATA: /api iletimi beklenen 401 yerine $code döndü"; exit 1; }
      - name: Sağlık kontrolü olan servisler "healthy"
        run: |
          # Sayfanın yanıt vermesi yetmiyor; container'ın kendi sağlık kontrolü de geçmeli.
          for svc in web vision postgres; do
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$($COMPOSE ps -q $svc)")
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            echo "$svc: $status"
            [ "$status" = "healthy" ] || { echo "HATA: $svc sağlıklı değil"; exit 1; }
          done
      - name: Loglar (hata olursa)
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Kapat
        if: always()
        run: $COMPOSE down -v

  # ---------- .NET agent ----------
  agent:
    name: agent (.NET build + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: agent projesi var mı?
        id: check
        shell: bash
        run: |
          if ls agent/*.sln agent/*.slnx >/dev/null 2>&1 || find agent -name '*.csproj' | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "agent klasöründe henüz proje yok, atlanıyor."
          fi
      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.exists == 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: agent
        run: dotnet build -c Release
      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: agent
        run: dotnet test -c Release --no-build --verbosity normal
      # macOS ajanı (Y7a) Intel ve Apple Silicon için derlenebiliyor mu. Çalıştırma ve eşleştirme denemesi Mac'te yapılıyor;
      # burada çekirdeğe Windows'a özgü bir şey girip macOS derlemesini bozmasın diye kontrol ediliyor.
      - name: macOS derlemesi
        if: steps.check.outputs.exists == 'true'
        working-directory: agent
        shell: bash
        run: |
          for rid in osx-arm64 osx-x64; do
            dotnet publish src/AIGuard.Agent.MacOS -c Release -r "$rid" --self-contained true -o "dist/macos-$rid"
            test -f "dist/macos-$rid/aiguard-agent"
          done
      # Y4: tek dosyalık kurulum paketi üretilebiliyor mu (örnek adreslerle; gerçek paket kurum adresleriyle üretilir).
      - name: Kurulum paketi
        if: steps.check.outputs.exists == 'true'
        shell: pwsh
        run: |
          ./agent/scripts/publish-windows.ps1 -ApiBaseUrl https://api.sinav.ornek.edu.tr -AllowedOrigins https://sinav.ornek.edu.tr -Output agent/dist/windows
          $files = Get-ChildItem agent/dist/windows
          if ($files.Count -ne 1 -or $files[0].Name -ne 'aiguard-agent.exe') { throw "Paket tek dosya değil: $($files.Name -join ', ')" }
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.exists == 'true'
        with:
          name: aiguard-agent-windows-ornek
          path: agent/dist/windows/aiguard-agent.exe
          retention-days: 7
