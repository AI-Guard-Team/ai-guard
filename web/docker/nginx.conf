# AI-Guard web (E1b). Önyüz dosyalarını sunar, /api isteklerini api servisine iletir.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # nginx sürümü yanıtlarda görünmesin.
    server_tokens off;

    # Docker'ın iç DNS'i. "api" adını açılışta değil istek anında çözüyoruz: api yeniden
    # başlayıp IP'si değişse bile nginx'i yeniden başlatmak gerekmiyor.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Önyüz API'yi aynı adresten (/api) çağırıyor: tarayıcı için aynı origin, API'de CORS gerekmiyor.
    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        # Gerçek istemci IP'si; API bunu yalnızca bu container'dan kabul ediyor (K-16, TrustedProxySetup).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SignalR (WebSocket) için.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # Tek sayfalı uygulama: bilinmeyen yollar index.html'e düşer, yönlendirmeyi React yapar.
    location / {
        try_files $uri /index.html;
    }
}
