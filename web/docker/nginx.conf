# AI-Guard web (E1b). Önyüz dosyalarını sunar, /api isteklerini api servisine iletir.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # nginx sürümü yanıtlarda görünmesin.
    server_tokens off;

    # ---------- Güvenlik başlıkları (UI1) ----------
    # CSP: kod, stil, yazı tipi yalnızca bu siteden (yazı tipleri pakette, CDN yok). connect-src'deki
    # 127.0.0.1:47321 güvenlik ajanının yerel ucu (K-19); kamera önizlemesi ve fotoğraf blob: ile.
    # Satır içi <script> yok; React'in style özniteliği CSSOM ile yazıldığı için 'unsafe-inline' gerekmiyor.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' http://127.0.0.1:47321; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    # Davet ve sıfırlama bağlantılarındaki belirteç başka sitelere Referer ile gitmesin.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Kamera ve mikrofon yalnızca bu site için; diğer donanım erişimleri kapalı.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Docker'ın iç DNS'i. "api" adını açılışta değil istek anında çözüyoruz: api yeniden
    # başlayıp IP'si değişse bile nginx'i yeniden başlatmak gerekmiyor.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Önyüz API'yi aynı adresten (/api) çağırıyor: tarayıcı için aynı origin, API'de CORS gerekmiyor.
    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        # Gerçek istemci IP'si; API bunu yalnızca bu container'dan kabul ediyor (K-16, TrustedProxySetup).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SignalR (WebSocket) için.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # SignalR hub'ları (A4: /hubs/review). WebSocket'e yükseltme için Upgrade/Connection başlıkları.
    location /hubs/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        # Bağlantı uzun süre açık kalıyor; varsayılan 60 sn'de koparılmasın.
        proxy_read_timeout 1h;
        # Tarayıcı belirteci access_token sorgu parametresiyle gönderiyor; erişim günlüğüne yazılmasın.
        access_log off;
    }

    # Derlenen dosyaların adında içerik özeti var; uzun süre önbellekte kalabilir.
    # (location içinde add_header olunca üstteki başlıklar devralınmadığı için güvenlik başlıkları tekrar ediliyor.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Tek sayfalı uygulama: bilinmeyen yollar index.html'e düşer, yönlendirmeyi React yapar.
    # index.html önbelleğe alınmaz: yeni sürüm yayımlanınca eski parça adlarına gidilmesin.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' http://127.0.0.1:47321; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri /index.html;
    }
}
